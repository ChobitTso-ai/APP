插圖版本 v4.0 --><title>自來水：保存液排名之外的最後備案</title><desc>v4.0；2026-10-02 由 Claude 拿掉紅色叉。水龍頭與盛水杯。自來水不在 IADT 保存液排名內，但也不是禁用：只有自來水與讓牙齒乾燥兩個選擇時，短暫放在水中仍優於乾燥。這張是保存液判別，不是沖洗步驟。</desc><g data-object="faucet"><path d="M28 47L99 47L99 39L129 39L129 47L155 47Q177 47 177 70L177 82L150 82L150 73L28 73Z" fill="#C9D4E2" stroke="#C9D4E2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M113 39 V25M92 25 H137" fill="none" stroke="#C9D4E2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M156 90L156 121M169 91L169 129" fill="none" stroke="#4DA3FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-object="water-cup"><path d="M115 137L124 208L202 208L211 137Z" fill="#4DA3FF" opacity=".15"/><path d="M119 165Q163 174 208 165L202 208L124 208Z" fill="#4DA3FF" opacity=".4"/><path d="M115 137L124 208L202 208L211 137M115 137Q163 148 211 137" fill="none" stroke="#C9D4E2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
