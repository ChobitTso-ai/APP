<title>齒槽骨骨折：三顆前牙與骨段共同移位</title>
<desc>完整上顎前牙唇舌向剖面示意。三顆連續前牙保持彼此相對位置，連同連續齒槽骨及牙齦作為一個骨段共同位移。骨折線橫跨根尖的根尖側；本圖根尖朝上，所以骨折線位於根尖上方。三顆牙本體完整，未畫牙根斷裂或各牙獨立脫位。牙體與牙周韌帶沿用已核准母版，骨與牙齦依連續骨段重畫。</desc>
