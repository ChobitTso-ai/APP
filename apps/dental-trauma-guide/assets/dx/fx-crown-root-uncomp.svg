<title>單純性牙冠牙根斷裂（未露髓）</title>
<desc>v2.0。完整上顎中門齒唇舌向剖面，根尖朝上，左唇側、右腭側。斷裂自唇側切端向腭側齦緣下牙根斜行延伸，避開牙髓腔並保留牙本質屏障。冠側斷片保留，向右下小幅平移表示稍微分離。牙髓完整且未暴露；除斷裂分割與斷片平移外，解剖形狀沿用已核准母版。</desc>
