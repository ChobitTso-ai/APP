# DentFigure — upstream FigureLab regression baseline.
#
# Runs the pinned upstream test suite unmodified. This workflow adds no runtime
# behaviour to any app — nothing here is loaded by a page — so it satisfies the
# "no functional changes" rule of the DentFigure baseline milestone.
#
# Scoped with `paths:` so it does NOT run on ordinary App hub changes: the suite
# takes ~3.4 minutes and has nothing to say about the homepage or the other tools.
# It is also separate from pages.yml, so a failure here cannot block deployment.
#
# Baseline at upstream e30779666948db7026706d10dd8ae3ae868f9fa0 (v3.16.0+2):
#   469 passed, 0 failed, 0 skipped.
# If this job reports a different number, THIS number is authoritative: the local
# baseline ran on Chromium build 1194 via an override config, because the dev
# container lacked the build Playwright 1.60 expects. See apps/dentfigure/UPSTREAM.md.
name: DentFigure upstream regression

on:
  push:
    branches: [main]
    paths:
      - 'apps/dentfigure/**'
      - '.github/workflows/dentfigure-upstream.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/dentfigure/**'
      - '.github/workflows/dentfigure-upstream.yml'
  workflow_dispatch:

jobs:
  upstream-e2e:
    name: FigureLab Playwright suite (pinned snapshot)
    # Pinned, NOT ubuntu-latest. GitHub moved `ubuntu-latest` to Ubuntu 26.04, and
    # the snapshot's pinned Playwright 1.60.0 cannot install system dependencies
    # for it:
    #   Cannot install dependencies for ubuntu26.04-x64 with Playwright 1.60.0!
    #   ERROR: Playwright does not support chromium on ubuntu26.04-x64
    # The job then died in ~13 seconds, before a single test ran — and because this
    # workflow is deliberately separate from pages.yml so it cannot block deploys,
    # nothing else went red. It failed that way on every run from 2026-10-26 to
    # 2026-11-10 (runs 11–18) while three PRs were merged citing "469 tests have
    # our back". They did not: the suite had not executed since 2026-09-19.
    #
    # The runner version is the one thing here that must NOT float: the whole point
    # of this job is to run a pinned snapshot against a pinned Playwright. Bumping
    # Playwright instead would change the baseline we are comparing against.
    # When this eventually needs a newer image, bump the snapshot's Playwright
    # first, re-establish the 469 count, and update UPSTREAM.md.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/dentfigure/upstream/figurelab/tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dentfigure/upstream/figurelab/tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # `set -o pipefail` matters: GitHub runs steps with `bash -e`, not `-o pipefail`,
      # so without it a failing `npm test` piped into `tee` would exit 0 and the suite
      # would "pass" on tee's exit code.
      - name: Run upstream suite
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/upstream.log

      # A green job is not the same as a complete job. This suite has already failed
      # silently once the other way round: three files were missing from the snapshot,
      # encoding.spec.js SKIPPED the checks that read them, and the run reported
      # 460 passed / 0 failed / exit 0. Nine tests vanished with nothing red.
      # So assert the TOTAL, not just the absence of failures.
      - name: Assert the baseline is still 469 tests
        shell: bash
        run: |
          set -euo pipefail
          n=$(grep -oE '[0-9]+ passed' /tmp/upstream.log | tail -1 | grep -oE '[0-9]+' || true)
          echo "passed: ${n:-<not found>}"
          if [ "${n:-0}" != "469" ]; then
            echo "::error::上游基線應為 469 筆,實際 ${n:-0} 筆。測試可能被靜默跳過,或上游快照換了版本——若是後者,請更新 apps/dentfigure/UPSTREAM.md 與這個數字。"
            exit 1
          fi

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dentfigure-upstream-playwright-report
          path: apps/dentfigure/upstream/figurelab/tests/playwright-report/
          retention-days: 7
